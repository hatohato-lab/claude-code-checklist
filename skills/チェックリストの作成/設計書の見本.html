<h2>1. 候補の資料を並べる（本と論文の20点）</h2>
<p>図書館の蔵書の検索と論文の検索で、候補を20点並べます。</p>
<h2>2. 範囲の決め方（3つの条件）</h2>
<table>
<caption>範囲に入れる条件（3つ）</caption>
<tr><th>条件</th><th>理由</th></tr>
<tr><td>2020年以降に出たもの</td><td>古い統計を避けるため</td></tr>
<tr><td>日本語か英語で読めるもの</td><td>読む時間を見積もれるため</td></tr>
<tr><td>図書館で借りられるか、無料で読めるもの</td><td>費用をかけないため</td></tr>
</table>
<h2>3. 決めた範囲（12点）</h2>
<p>3つの条件に合った12点を、集める範囲にします。<span class="important">条件に合わない8点は集めません。</span></p>
<p>12点の一覧は、設計書「集めた資料の一覧」に書きます。</p>
<div id="zoom" aria-hidden="true">
  <div class="bar">
    <button id="zoomOut">小さく</button>
    <button id="zoomIn">大きく</button>
    <button id="zoomClose">閉じる（Esc）</button>
  </div>
  <div class="inner" id="zoomBox"></div>
</div>
<script>
(function () {
  var zoom = document.getElementById('zoom');
  var box  = document.getElementById('zoomBox');
  var scale = 1, baseW = 0;
  function apply() {
    var s = box.querySelector('svg');
    if (s && baseW) { s.setAttribute('width', Math.round(baseW * scale)); s.removeAttribute('height'); }
  }
  function open(src) {
    var clone = src.cloneNode(true);
    clone.removeAttribute('style');
    var vb = (clone.getAttribute('viewBox') || '').split(/[\s,]+/);
    baseW = vb.length === 4 ? parseFloat(vb[2]) : (src.clientWidth || 800);
    scale = Math.min(1.6, Math.max(1, (window.innerWidth - 110) / baseW));
    box.innerHTML = '';
    box.appendChild(clone);
    apply();
    zoom.classList.add('on');
    zoom.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }
  function close() {
    zoom.classList.remove('on');
    zoom.setAttribute('aria-hidden', 'true');
    box.innerHTML = '';
    document.body.style.overflow = '';
  }
  document.querySelectorAll('figure svg').forEach(function (s) {
    s.addEventListener('click', function () { open(s); });
  });
  document.getElementById('zoomClose').addEventListener('click', close);
  document.getElementById('zoomIn').addEventListener('click', function () { scale = Math.min(scale * 1.25, 6); apply(); });
  document.getElementById('zoomOut').addEventListener('click', function () { scale = Math.max(scale / 1.25, 0.3); apply(); });
  zoom.addEventListener('click', function (e) {
    if (e.target === zoom || e.target.tagName.toLowerCase() === 'svg') close();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
})();
</script>
